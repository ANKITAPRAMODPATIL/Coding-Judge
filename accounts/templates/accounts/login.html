<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Judge</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff !important;
            border-radius: 10px;
            padding: 12px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .btn-custom {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
        }
        a {
            color: #38bdf8;
        }
        a:hover {
            color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <h3 class="text-center mb-4 fw-bold" style="color: #38bdf8;">Welcome Back</h3>
        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label small text-secondary">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-custom w-100 mt-3">Login</button>
        </form>
        <p class="text-center mt-4 small text-secondary">
            Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none">Sign up here</a>
        </p>
    </div>

</body>
</html>
