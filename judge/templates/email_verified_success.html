<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Online Judge</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; margin: 0; }
        .navbar-custom { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 30px; }
        .auth-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); width: 100%; max-width: 450px; text-align: center; }
        .btn-auth { background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; border-radius: 8px; padding: 12px; font-weight: 600; color: white; width: 100%; transition: 0.3s; display: inline-block; text-decoration: none; }
        .btn-auth:hover { background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        .text-accent { color: #38bdf8; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark"><a class="navbar-brand fw-bold text-accent mx-auto" href="#">⚡ Online Judge</a></nav>
    <div class="container d-flex justify-content-center align-items-center py-5 flex-grow-1">
        <div class="auth-card">
            <h3 class="fw-bold text-light mb-3">Email Verified Successfully!</h3>
            <p class="text-secondary small mb-4">Your email has been verified. You can now log in to your account.</p>
            <a href="{% url 'login' %}" class="btn btn-auth">Log In Now</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
