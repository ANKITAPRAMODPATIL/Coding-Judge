<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Judge System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        [data-bs-theme="dark"] {
            --bg: #0b0f19;
            --card: #161e2e;
            --border: #1f2937;
            --text: #f3f4f6;
            --nav-bg: rgba(17,24,39,.92);
            --footer-bg: #111827;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            color: var(--text) !important;
            background: var(--bg) !important;
        }

        /* NAVBAR */
        .navbar{
            background: var(--nav-bg) !important;
            backdrop-filter:blur(14px);
            border-bottom:1px solid var(--border);
            box-shadow:0 4px 20px rgba(0,0,0,.2);
        }

        .navbar-brand{
            transition:.3s;
        }

        .navbar-brand:hover{
            transform:scale(1.03);
        }

        .brand-logo{
            color:var(--primary);
            font-size:1.8rem;
        }

        .brand-title{
            color:var(--primary);
            font-weight:700;
            font-size:1.25rem;
            line-height:1.1;
        }

        .brand-subtitle{
            color:#9ca3af;
            font-size:11px;
        }

        .nav-link{
            color:#d1d5db !important;
            transition:.3s;
            font-weight:500;
        }

        .nav-link:hover{
            color:var(--primary)!important;
        }

        .dropdown-menu{
            background: var(--card) !important;
            color: var(--text) !important;
            border:1px solid var(--border) !important;
        }

        /* CARDS */
        .card{
            background: var(--card) !important;
            color: var(--text) !important;
            border:1px solid var(--border)!important;
            border-radius:16px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-3px);
        }

        /* BUTTONS */
        .btn-info{
            font-weight:600;
        }

        .btn-outline-info:hover{
            transform:translateY(-1px);
        }

        /* CONTENT */
        .main-content{
            flex:1;
        }

        /* FOOTER */
        footer{
            background: var(--footer-bg);
            color: var(--text);
            border-top:1px solid var(--border);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar{
            width:8px;
            height:8px;
        }

        ::-webkit-scrollbar-track{
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb{
            background:#374151;
            border-radius:4px;
        }

        ::-webkit-scrollbar-thumb:hover{
            background:#4b5563;
        }
    </style>
</head>

<body>

<nav class="navbar py-3">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="text-center">
            <h3 class="text-info fw-bold mb-0">
                <i class="bi bi-code-square me-2"></i>
                Online Judge System
            </h3>
        </div>
    </div>
</nav>

<div class="container my-4 main-content">
    {% block content %}
    {% endblock %}
</div>

<footer class="text-center py-3 text-secondary">
    <p class="mb-0">
        © 2026 Online Judge System • All Rights Reserved
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
