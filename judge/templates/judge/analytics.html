{% extends 'judge/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 mb-5" style="color: var(--text) !important;">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-2xl font-bold mb-4" style="color: var(--bs-info) !important;">📊 Performance Analytics Dashboard</h2>
        </div>
    </div>

    <!-- Cards Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-center">
        <div class="p-5 rounded-lg shadow" style="background: var(--card) !important; border: 1px solid var(--border) !important; color: var(--text) !important;">
            <h5 class="font-medium mb-1" style="color: #9ca3af !important;">Total Submissions</h5>
            <h3 class="text-2xl font-bold mb-0" style="color: var(--text) !important;">{{ total_subs }}</h3>
        </div>
        <div class="p-5 rounded-lg shadow" style="background: var(--card) !important; border: 1px solid var(--border) !important; color: var(--text) !important;">
            <h5 class="font-medium mb-1" style="color: #9ca3af !important;">Accepted Submissions</h5>
            <h3 class="text-2xl font-bold mb-0" style="color: var(--bs-success) !important;">{{ accepted_subs }}</h3>
        </div>
        <div class="p-5 rounded-lg shadow" style="background: var(--card) !important; border: 1px solid var(--border) !important; color: var(--text) !important;">
            <h5 class="font-medium mb-1" style="color: #9ca3af !important;">Success Rate</h5>
            <h3 class="text-2xl font-bold mb-0" style="color: var(--bs-warning) !important;">{{ success_rate }}%</h3>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-6">
        <div class="md:col-span-5 p-5 rounded-lg shadow flex flex-col" style="background: var(--card) !important; border: 1px solid var(--border) !important;">
            <h5 class="font-semibold mb-3" style="color: var(--bs-info) !important;">Solved by Difficulty</h5>
            <div class="relative h-64 w-full">
                <canvas id="difficultyChart"></canvas>
            </div>
        </div>
        <div class="md:col-span-7 p-5 rounded-lg shadow flex flex-col" style="background: var(--card) !important; border: 1px solid var(--border) !important;">
            <h5 class="font-semibold mb-3" style="color: var(--bs-info) !important;">Submission Trends (Last 7 Days)</h5>
            <div class="relative h-64 w-full">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="{% url 'profile' %}" class="inline-block px-4 py-2 rounded-md text-sm font-medium" style="background: var(--card); color: var(--text); border: 1px solid var(--border); text-decoration: none;">Back to Profile</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const diffCtx = document.getElementById('difficultyChart').getContext('2d');
    new Chart(diffCtx, {
        type: 'doughnut',
        data: {
            labels: ['Easy', 'Medium', 'Hard'],
            datasets: [{
                data: [
                    {{ difficulty_counts.Easy }}, 
                    {{ difficulty_counts.Medium }}, 
                    {{ difficulty_counts.Hard }}
                ],
                backgroundColor: ['#2ecc71', '#f39c12', '#e74c3c'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#f3f4f6' } }
            }
        }
    });

    const trendCtx = document.getElementById('trendChart').getContext('2d');
    new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: {{ trend_labels|safe }},
            datasets: [{
                label: 'Submissions',
                data: {{ trend_counts|safe }},
                borderColor: '#0dcaf0',
                backgroundColor: 'rgba(13, 202, 240, 0.1)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                y: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } }
            },
            plugins: {
                legend: { labels: { color: '#f3f4f6' } }
            }
        }
    });
</script>
{% endblock %}
