<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Georgia', serif; }
        .certificate-box { background: #fff; width: 800px; padding: 40px; text-align: center; border: 10px solid #1a365d; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        h1 { color: #1a365d; font-size: 40px; margin-bottom: 10px; }
        h3 { color: #555; font-size: 20px; font-weight: normal; }
        .name { font-size: 32px; color: #2b6cb0; border-bottom: 2px solid #2b6cb0; display: inline-block; margin: 20px 0; padding-bottom: 5px; font-weight: bold; }
        .footer { margin-top: 60px; display: flex; justify-content: space-between; padding: 0 40px; }
        .sig { border-top: 1px solid #333; width: 200px; text-align: center; padding-top: 5px; font-size: 14px; position: relative; }
        /* To position the signature right above the line */
        .sig-name { font-family: 'Brush Script MT', cursive, sans-serif; font-size: 24px; color: #1a365d; position: absolute; top: -32px; left: 0; right: 0; }
    </style>
</head>
<body>
    <div class="certificate-box">
        <h1>Certificate of Achievement</h1>
        <h3>This is proudly presented to</h3>
        <div class="name">Ankita</div>
        <p style="color: #666; font-size: 16px; margin-top: 10px;">For successfully completing coding challenges and demonstrating excellence on the platform.</p>
        
        <div class="footer">
            <div class="sig">
                <div class="sig-name">Ankita</div>
                Platform Director
            </div>
            <div class="sig">
                <div class="sig-name">13 Aug 2026</div>
                Date Issued
            </div>
        </div>
    </div>
</body>
</html>
