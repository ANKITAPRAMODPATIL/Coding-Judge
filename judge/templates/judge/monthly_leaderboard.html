<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Leaderboard - Online Judge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">🏆 Monthly Leaderboard</h2>
        <div class="d-flex justify-content-center mb-4">
            <a href="{% url 'leaderboard_view' %}" class="btn btn-outline-info me-2">All-Time Leaderboard</a>
            <a href="{% url 'monthly_leaderboard' %}" class="btn btn-info">Monthly Leaderboard</a>
        </div>
        <div class="card bg-secondary text-light p-4 shadow">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th>Problems Solved (This Month)</th>
                        <th>Total Score</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in profiles %}
                    <tr>
                        <td><strong>#{{ forloop.counter }}</strong></td>
                        <td>{{ p.user.username }}</td>
                        <td><span class="badge bg-success">{{ p.monthly_solved }} Solved</span></td>
                        <td>{{ p.score }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No activity recorded for this month yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
