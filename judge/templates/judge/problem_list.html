{% extends 'judge/base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Search and Filter Form -->
    <form method="GET" class="flex flex-col md:flex-row gap-4 bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md">
        <!-- Search Input -->
        <div class="flex-grow">
            <input type="text" name="q" value="{{ query }}" 
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-indigo-500" 
                   placeholder="Search problems or tags...">
        </div>
        
        <!-- Difficulty Dropdown -->
        <div class="w-full md:w-48">
            <select name="difficulty" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-indigo-500">
                <option value="">All Difficulties</option>
                <option value="Easy" {% if selected_difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Medium" {% if selected_difficulty == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Hard" {% if selected_difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>

        <!-- Filter Button -->
        <div>
            <button type="submit" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-lg transition">
                Filter
            </button>
        </div>
    </form>

    <!-- Problems List -->
    <div class="space-y-3">
        {% for problem in problems %}
            <a href="{% url 'problem_detail' problem.id %}" class="block bg-gray-800 border border-gray-700 hover:border-indigo-500 rounded-lg p-4 transition shadow-sm">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                        <h5 class="text-lg font-semibold text-white hover:text-indigo-400">{{ problem.title }}</h5>
                        <p class="text-sm text-indigo-300 mt-1">Tags: {{ problem.tags }}</p>
                    </div>
                    <div>
                        <span class="px-3 py-1 text-xs font-semibold rounded-full 
                            {% if problem.difficulty == 'Easy' %} bg-green-900 text-green-300 border border-green-700
                            {% elif problem.difficulty == 'Medium' %} bg-yellow-900 text-yellow-300 border border-yellow-700
                            {% else %} bg-red-900 text-red-300 border border-red-700 {% endif %}">
                            {{ problem.difficulty }}
                        </span>
                    </div>
                </div>
            </a>
        {% empty %}
            <div class="text-center py-10 bg-gray-800 rounded-lg border border-gray-700">
                <p class="text-gray-400">No problems found.</p>
            </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
